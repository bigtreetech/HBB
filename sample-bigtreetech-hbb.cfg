########################################
# BIGTREETECH HBB V1.0 sample config
########################################
#
# The buttons are wired active-low, so every pin needs a leading '!'. Without
# it Klipper reads them backwards: QUERY_BUTTON reports PRESSED with nothing
# touched, and release_gcode fires when you physically PUSH the button.
#
# Check with `QUERY_BUTTON BUTTON=key1` before trusting either edge. Getting it
# wrong is silent -- the buttons still work, just on the opposite edge, which
# only shows up once something cares which edge is which (a long press, say).
#
# For richer patterns -- LEDs that follow printer state, long press, cycling
# through preset temperatures -- see RECIPES.md.

[mcu HBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_hbb-if00
restart_method: command

# The RP2040's own die temperature. Free, and it makes a dead or overheating
# button box visible in the web UI instead of silently unresponsive.
[temperature_sensor HBB]
sensor_type: temperature_mcu
sensor_mcu: HBB
min_temp: 10
max_temp: 100

[gcode_button key1]
pin: !HBB:gpio25
press_gcode:
  G28 X
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=1
release_gcode:

[gcode_button key2]
pin: !HBB:gpio26
press_gcode:
  G28 Y
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2
release_gcode:

[gcode_button key3]
pin: !HBB:gpio27
press_gcode:
  G28 Z
  SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=3
release_gcode:

[gcode_button key4]
pin: !HBB:gpio19
press_gcode:
  G28
  SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0 INDEX=4
release_gcode:

[gcode_button key5]
pin: !HBB:gpio18
press_gcode:
  M84
  SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=5
release_gcode:

[gcode_button key6]
pin: !HBB:gpio13
press_gcode:
  M104 S200
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=6
release_gcode:

[gcode_button key7]
pin: !HBB:gpio12
press_gcode:
  M140 S60
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=7
release_gcode:

[neopixel HBB_LED]
pin: HBB:gpio20
chain_count: 7
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
